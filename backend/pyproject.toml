[project]
name = "documind-backend"
version = "0.1.0"
description = "DocuMind: hybrid RAG with built-in evaluation"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "bm25s>=0.3.13",
    "faiss-cpu>=1.15.1",
    "fastapi[standard]>=0.143.0",
    "fastembed>=0.9.0",
    "numpy>=2.5.4",
    "openai>=3.28.0",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.20.0",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.48",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8.9",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# FastAPI's Depends()/Header() defaults are the intended pattern
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
# prompt text reads better unwrapped
"app/answer/prompt.py" = ["E501"]
"app/eval/judge.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
