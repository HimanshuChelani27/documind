name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DOCUMIND_MODEL_CACHE_DIR: ${{ github.workspace }}/backend/models
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Cache ONNX models
        uses: actions/cache@v4
        with:
          path: backend/models
          key: fastembed-${{ hashFiles('backend/app/config.py') }}
      - run: uv sync --frozen
      - run: uv run ruff check app tests ../samples
      - run: uv run ruff format --check app tests ../samples
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng build
