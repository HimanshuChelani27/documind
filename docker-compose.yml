# docker compose up --build  →  UI on http://localhost:4300, API on http://localhost:8002
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ["8002:8000"]
    env_file:
      - path: backend/.env
        required: false
    environment:
      DOCUMIND_CORS_ORIGINS: '["http://localhost:4300"]'
    volumes:
      - documind-data:/app/backend/data

  web:
    build: ./frontend
    ports: ["4300:80"]
    environment:
      DOCUMIND_API_URL: http://localhost:8002
    depends_on: [api]

volumes:
  documind-data:
